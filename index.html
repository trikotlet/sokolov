<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var cookies = document.cookie.split(";").map(function (cookie) {
          return cookie.trim();
        });
        var theme = cookies.find(function (cookie) {
          return cookie.startsWith("portfolio-theme=");
        });
        document.documentElement.setAttribute("data-theme", theme === "portfolio-theme=light" ? "light" : "dark");
        var language = cookies.find(function (cookie) {
          return cookie.startsWith("portfolio-language=");
        });
        if (language === "portfolio-language=ru" || language === "portfolio-language=en") {
          document.documentElement.setAttribute("lang", language.slice("portfolio-language=".length));
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"

    />
